<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0b" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317181A'/%3E%3Cpath d='M9 11.5h14M9 16h10M9 20.5h6' stroke='%23F6F6F3' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='23' r='2.6' fill='%23245C4F'/%3E%3C/svg%3E"
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme") || "system";
          const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // Storage can be unavailable; the app still renders in the system theme.
        }
      })();
    </script>
    <title>记忆登记簿</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
