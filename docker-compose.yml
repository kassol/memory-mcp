services:
  memory-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-mcp
    restart: unless-stopped
    # Loopback only: the host's reverse proxy (1Panel OpenResty, host network) fronts it.
    ports:
      - "127.0.0.1:18765:8765"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - MEMORY_MCP_HOST=0.0.0.0
      - MEMORY_MCP_PORT=8765
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
