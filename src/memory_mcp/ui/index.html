<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>记忆登记簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="mark" aria-hidden="true"></span>
    <h1 class="title">记忆登记簿</h1>
    <nav class="tabs" aria-label="视图">
      <button type="button" class="tab" data-view="docket">待审<span class="count" id="docket-count"></span></button>
      <button type="button" class="tab" data-view="records">档案</button>
    </nav>
    <button type="button" class="link" id="logout" hidden>退出</button>
  </header>

  <main id="app">
    <section id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <h2>输入访问令牌</h2>
        <p class="hint">与服务配置中的 Bearer 令牌相同。只保存在本标签页，关闭即清除。</p>
        <label for="token" class="label">令牌</label>
        <input id="token" type="password" autocomplete="current-password" required spellcheck="false">
        <p class="error" id="login-error" role="alert"></p>
        <button type="submit" class="primary">进入</button>
      </form>
    </section>

    <section id="workspace" class="workspace" hidden>
      <aside class="ledger" aria-label="列表">
        <div class="ledger-head" id="ledger-head"></div>
        <ol class="rows" id="rows"></ol>
        <div class="ledger-foot" id="ledger-foot"></div>
      </aside>
      <article class="file" id="file" aria-live="polite"></article>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
